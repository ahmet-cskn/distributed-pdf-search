[project]
name = "pdfsearch"
version = "0.1.0"
description = "Distributed PDF indexing and substring search"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.107",
    "fastapi>=0.142.2",
    "pymupdf>=1.28.2",
    "redis>=8.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
pdfsearch-index = "pdfsearch.local_index:main"
pdfsearch-worker = "pdfsearch.worker:main"
pdfsearch-watch = "pdfsearch.watcher:main"
pdfsearch-generate = "pdfsearch.generate:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "moto[s3,sqs]>=5.2.3",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
addopts = ["--import-mode=importlib", "--doctest-modules"]
filterwarnings = [
    # Emitted by PyMuPDF's SWIG-generated bindings on import, not by our code.
    "ignore:builtin type (SwigPyPacked|SwigPyObject|swigvarlink) has no __module__ attribute:DeprecationWarning",
]
