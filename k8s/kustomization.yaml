# Everything that `make deploy` applies, all in the pdfsearch namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pdfsearch
resources:
  - namespace.yaml
  - redis.yaml
  - api.yaml
  - worker.yaml
  - keda.yaml
  - monitoring.yaml

# Deployment-specific AWS settings, generated by `make deploy` from Terraform's
# outputs (k8s/aws.env is git-ignored; see aws.env.example). The generated
# ConfigMap's name gets a hash of its content, so changing a value rolls the
# workers automatically.
configMapGenerator:
  - name: aws-config
    envs:
      - aws.env
