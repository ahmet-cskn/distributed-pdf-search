# Redis holding the trigram index (docs/DESIGN.md §4.3).
# Other pods reach it at redis://redis:6379.
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
---
# A StatefulSet instead of a Deployment: the pod keeps a stable identity and
# its own persistent volume, which survives the pod being deleted or moved.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    app: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      # Run as the image's unprivileged "redis" user and group (uid 999,
      # gid 1000); fsGroup makes the mounted volume writable for that group.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: redis
          image: redis:8-alpine
          # Append-only file: every write is logged to /data and replayed on restart.
          # Snapshots (on by default) are turned off: the AOF already persists
          # everything, and during indexing a snapshot was taken every minute,
          # each forking Redis and writing the whole index to disk again.
          args: ["redis-server", "--appendonly", "yes", "--save", ""]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              # The index for ~1,000 PDFs measured ~690 MB (docs/DESIGN.md §9);
              # rewriting the AOF file needs temporary extra memory on top.
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
        # Sidecar: translates Redis' INFO statistics (commands per second, CPU
        # time, memory) into Prometheus metrics on port 9121.
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.93.0
          env:
            - name: REDIS_ADDR
              value: redis://localhost:6379
          ports:
            - name: metrics
              containerPort: 9121
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
